<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="InstaFarma: tu autoservicio de confianza" />

    <title>InstaFarma</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/index.css">

    <!-- Importación de js con 'defer' para que se ejecute luego de que 
     se cargue el HTML -->
    <script src="index.js" defer></script>

    <!-- Importación de fuentes Google Fonts e íconos -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <img class="icono" src="img/logo.png" alt="Icono de InstaFarma">
        <div class="titulo">
            <h1>InstaFarma</h1>
        </div>
    </header>

    <main>
        <section id="contenedor-productos">
        </section>
    </main>

    <footer class="footer">
        <span>2026 - InstaFarma</span>
    </footer>

    <script>
        const urlBase = "http://localhost:3000";
        const contenedorProductos = document.getElementById("contenedor-productos");

        async function obtenerProductos() {
            try {
                const response = await fetch(`${urlBase}/api/products`);
                console.log(response);
                const data = await response.json();

                if(!response.ok){
                    console.error(data.message);
                    return mostrarError(data.message);
                }

                const productos = data.payload;
                renderizarProductos(productos);

            } catch (error) {
                console.error("Error al obtener productos: ", error);
                return mostrarError("Error de conexión con el servidor");
            }
        }

        function renderizarProductos(array) {
            let htmlProductos = "";

            array.forEach(producto => {
                console.log(producto.name.length);
                htmlProductos += `
                    <div class="card-producto">
                        <img class="card-img" src="${producto.image}" alt="${producto.name}">
                            <h4 title="${producto.name}">${producto.name.length > 40 ? `${producto.name.slice(0, 40)}...` : producto.name}</h4>
                            <p>$ ${producto.price}</p>
                            <p>Id: ${producto.id}</p>
                            <p>Estado: ${producto.active}</p>

                            <ul class="iconos">
                                <li>
                                    <i id="btn-modificar" class="fa-solid fa-pen-to-square"></i>
                                </li>
                                <li>
                                    <i id="btn-eliminar" class="fa-solid fa-trash-can"></i>
                                </li>
                            </ul>
                    </div>
                `;
            });

            contenedorProductos.innerHTML = htmlProductos;
        }

        function mostrarError(mensaje){
            contenedorProductos.innerHTML = `<p class="error">${mensaje}</p>`
        }

        contenedorProductos.addEventListener("click", async (event) => {
            const btnEliminar = event.target.closest(".fa-trash-can");
            const btnModificar = event.target.closest(".fa-pen-to-square");

            // ELIMINAR PRODUCTO
            if (btnEliminar) {
                const card = btnEliminar.closest(".card-producto");

                const id = card.querySelector("p:nth-of-type(2)")
                    .textContent.replace("Id: ", "").trim();

                if (confirm(`¿Estás seguro de eliminar el producto ${id}?`)) {
                    await eliminarProducto(id);
                }
            }

            // MODIFICAR PRODUCTO
            if (btnModificar) {
                const card = btnModificar.closest(".card-producto");

                const id = card.querySelector("p:nth-of-type(2)")
                    .textContent.replace("Id: ", "").trim();

                renderizarModifProducto(id);
            }
        });
        async function eliminarProducto(id) {
            try {
                const response = await fetch(`${urlBase}/api/products/${id}`, {
                    method: "DELETE"
                });

                const data = await response.json();

                if (!response.ok) {
                    return mostrarError(data.message);
                }

                alert(data.message);
                obtenerProductos();

            } catch (error) {
                console.error("Error al eliminar producto:", error);
                mostrarError("Error de conexión con el servidor");
            }
        }

        obtenerProductos();
    </script>
</body>
</html>
