<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InstaFarma: tu autoservicio de confianza" />

    <title>InstaFarma</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/index.css">

    <!-- Importación de js con 'defer' para que se ejecute luego de que 
     se cargue el HTML -->
    <script src="index.js" defer></script>

    <!-- Importación de fuentes Google Fonts e íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <img class="icono" src="img/logo.png" alt="Icono de InstaFarma">
        <div class="titulo">
            <h1>InstaFarma</h1>
        </div>
    </header>

    <main>
        <section class="titulo">
            <h2>Crear producto</h2>
        </section>
        <section class="formulario">
            <form id="create-form">
                <label for="categoryProduct">Categoría</label>
                <select name="category" id="categoryProduct" required>
                    <option value="belleza">Belleza</option>
                    <option value="farmacia">Farmacia</option>
                </select>

                <label for="imageProduct">Imagen</label>
                <input type="text" name="image" id="imageProduct" required>

                <label for="nameProduct">Nombre</label>
                <input type="text" name="name" id="nameProduct" required>

                <label for="priceProduct">Precio</label>
                <input type="number" name="price" id="priceProduct" min="1" required>

                <input type="submit" class="boton" value="Crear">

            </form>
        </section>

        <section id="contenedor-productos">
        </section>
        <section id="errors"></section>
    </main>

    <footer class="footer">
        <span>2026 - InstaFarma</span>
    </footer>

    <script>
        const urlBase = "http://localhost:3000";
        const contenedorProductos = document.getElementById("contenedor-productos");
        const createProductForm = document.getElementById("create-form");
        const errorContainer = document.getElementById("errors");

        createProductForm.addEventListener("submit", async (event) => {

            event.preventDefault();
            const formData = new FormData(event.target);
            console.log(formData);

            const formObjt = Object.fromEntries(formData.entries());

            formObjt.price = Number(formObjt.price);
            formObjt.name = formObjt.name.trim();

            const errors = validateForm(formObjt);

            if (errors.length > 0) {
                console.log(errors);
                return mostrarListaErrores(errors);
            }

            try {
                const response = await fetch(`${urlBase}/api/products`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formObjt)
                });
                console.log(response); //Borrar

                const data = await response.json();

                if (!response.ok) {
                    if (data.listaErrores) { 
                        return mostrarListaErrores(data.listaErrores) 
                    }
                    console.error(data.message);
                    return mostrarError(data.message);
                }

                let message = `${data.message} con Id ${data.productId}`;
                console.log(message);
                alert(message); //Reemplazar por mensaje de éxito

            } catch (error) {
                console.error("Error al obtener producto: ", error);
                return mostrarError("Error de conexión con el servidor");
            }
        });

        function armarError(mensaje){
            return `<p class="error">${mensaje}</p>`;
        }

        function mostrarError(mensaje) {
            errorContainer.innerHTML = armarError(mensaje)
        }

        function mostrarListaErrores(array) {
            let htmlErrores = "";

            array.forEach(error => {
                htmlErrores += armarError(error);
            });

            errorContainer.innerHTML = htmlErrores;
        }

        function validateForm(data) {
            const validCategories = ["belleza", "farmacia"];
            const errors = [];
            console.log(data);
            const { category, image, name, price } = data;

            if (!category || !image || !name || !price) {
                errors.push("Faltan campos requeridos");
            }

            if (name.length < 2) {
                errors.push("El nombre debe tener más de dos caracteres");
            }

            if (price <= 0) {
                errors.push("El precio debe ser un número mayor a cero");
            }

            if (image.trim().length < 2) {
                errors.push("El enlace de la imagen debe tener más de dos caracteres");
            }

            if (!validCategories.includes(category)) {
                errors.push("La categoría es inválida");
            }

            return errors;
        }
    </script>
</body>

</html>
