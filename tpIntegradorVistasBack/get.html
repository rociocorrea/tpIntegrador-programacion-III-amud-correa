<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InstaFarma: tu autoservicio de confianza" />

    <title>InstaFarma</title>
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="stylesheet" href="css/index.css">

    <!-- Importación de js con 'defer' para que se ejecute luego de que 
     se cargue el HTML -->
    <script src="index.js" defer></script>

    <!-- Importación de fuentes Google Fonts e íconos -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>
    <header class="header">
        <img class="icono" src="img/logo.png" alt="Icono de InstaFarma">
        <div class="titulo">
            <h1>InstaFarma</h1>
        </div>
    </header>

    <main>
        <section class="titulo">
            <h2>Consulte producto por Id</h2>
            <button class="boton-crear"><i class="fa-solid fa-square-plus"></i> Crear producto</button>
        </section>
        <section class="formulario">
            <form id="product-form">
                <label for="idProduct">Id producto</label>
                <input type="number" name="id" id="idProduct" min="1" required>

                <input type="submit" class="boton" value="Buscar">
            </form>
        </section>

        <section id="contenedor-producto">
        </section>
        <section class="acciones">
            <ul class="iconos">
                <li>
                    <i class="fa-solid fa-pen-to-square"></i>
                </li>
                <li>
                    <i class="fa-solid fa-trash-can"></i>
                </li>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <span>2026 - InstaFarma</span>
    </footer>

    <script>
        const urlBase = "http://localhost:3000";
        const contenedorProducto = document.getElementById("contenedor-producto");
        const getProductForm = document.getElementById("product-form");

        getProductForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const idProd = event.target.idProduct.value.trim();

            if (!idProd) {
                return mostrarError("Ingresar Id válido");
            }

            try {
                const response = await fetch(`${urlBase}/api/products/${idProd}`);
                console.log(response); //Borrar

                const data = await response.json();

                if (!response.ok) {
                    console.error(data.message);
                    return mostrarError(data.message);
                }

                const producto = data.payload[0];

                renderizarProducto(producto);

            } catch (error) {
                console.error("Error al obtener productos: ", error);
                return mostrarError("Error de conexión con el servidor");
            }
        });

        function renderizarProducto(producto) {
            let htmlProductos = `
                    <div class="card-producto">
                        <img class="card-img" src="${producto.image}" alt="${producto.name}">
                            <h4>${producto.name}</h4>
                            <p>$ ${producto.price}</p>
                            <p>Id: ${producto.id}</p>
                    </div>
                `;

            contenedorProducto.innerHTML = htmlProductos;
        }

        function mostrarError(mensaje) {
            contenedorProducto.innerHTML = `<p class="error">${mensaje}</p>`
        }

    </script>
</body>

</html>
